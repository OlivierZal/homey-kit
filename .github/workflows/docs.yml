# Calls the family's reusable docs pipeline (build the typedoc site,
# deploy it to GitHub Pages). The `github-pages` environment is set on
# the called deploy job, in configs; this stub grants the permissions
# the called jobs claim (`id-token: write` and `pages: write` for the
# deployment, `contents` and `packages` read for the build) and keeps
# the release trigger. `dry-run` rehearses the build half without
# deploying — dispatch it by hand after every re-pin of this path,
# before the next release reaches the deploy half.
jobs:
  docs:
    permissions:
      contents: read
      id-token: write
      packages: read
      pages: write
    uses: OlivierZal/configs/.github/workflows/reusable-docs.yml@76559db426286aab1f8e5ae8b0f98346cd9dfd2b # v6.0.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
name: Generate & deploy docs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Build the site without deploying it.
        type: boolean
permissions: {}
