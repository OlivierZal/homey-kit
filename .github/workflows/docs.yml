# Calls the family's reusable docs pipeline (build the typedoc site,
# deploy it to GitHub Pages). The `github-pages` environment and the
# `id-token: write` the deployment needs travel with the called job;
# this stub grants them and keeps the release trigger. `dry-run`
# rehearses the build half without deploying — dispatch it by hand
# after every re-pin of this path, before the next release reaches the
# deploy half.
jobs:
  docs:
    permissions:
      contents: read
      id-token: write
      packages: read
      pages: write
    uses: OlivierZal/configs/.github/workflows/reusable-docs.yml@9656fb8009b6b4c344dbdda62c99b95ed64bfe8f # v5.0.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
name: Generate & deploy docs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Build the site without deploying it.
        type: boolean
permissions: {}
