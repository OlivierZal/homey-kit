# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  triage:
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude-issue-triage.yml@140fc08403302560b9ae86c2aa7970ffe88e7c71 # v1.1.0
name: claude-issue-triage
on:
  issues:
    types: [opened]
permissions: {}
