# The apps' store release, callable: install with registry auth, publish
# with the Homey CLI from the `homey` environment, then assert the
# packaged bundles the CLI's post-copy build must have emitted (the
# com.melcloud #1404 class — packing happens inside the CLI, so the
# check is post-hoc and fails the workflow loudly right after the
# upload). Derived from the three publish.yml files the apps carried
# (2026-09-14), identical but for the bundle list and the stamped page,
# which are the two inputs. The `homey` environment travels with the
# job, as `npm` does in configs' reusable-publish.yml, and carries the
# page the upload is published from as its deployment link; the caller
# grants `contents: read` and `packages: read` and passes its HOMEY_PAT.
# Hosted here as Homey process (see reusable-homey-validate.yml).
concurrency:
  cancel-in-progress: false
  group: publish
jobs:
  publish:
    environment:
      name: homey
      url: ${{ steps.publish.outputs.url }}
    name: Publish app on Homey
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-and-install
        with:
          cache: none
          node-version: '22'
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          require-npm-token: 'true'
      # The command Athom's publish action runs, in a container of its
      # own and after a second install there, answering the app's page
      # alone. Run in the job's install, the CLI's closing line can be
      # read: it names the build it created, the page a release is
      # published from. A CLI that names none leaves the app's page, as
      # the action answers, and a CLI that fails fails the step through
      # the `tee` (`shell: bash` is what sets `pipefail`).
      - id: publish
        name: Publish
        env:
          HOMEY_HEADLESS: '1'
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        shell: bash
        run: |
          npx --yes homey app publish | tee "$RUNNER_TEMP/publish.log"
          url=$(
            grep --only-matching --extended-regexp \
              'https://tools\.developer\.homey\.app/apps/app/[^/[:space:]]+/build/[0-9]+' \
              "$RUNNER_TEMP/publish.log" | tail -n 1 || true
          )
          if [ -z "$url" ]; then
            url="https://tools.developer.homey.app/apps/app/$(jq --raw-output .id app.json)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The inputs reach the shell through the environment, never
      # interpolated into the script.
      - name: Assert the packaged bundles
        env:
          BUNDLES: ${{ inputs.bundles }}
          STAMPED_PAGE: ${{ inputs.stamped-page }}
        run: |
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ ! -s ".homeybuild/$file" ]; then
              echo "::error::Missing packaged bundle: .homeybuild/$file"
              exit 1
            fi
          done <<<"$BUNDLES"
          if [ ! -s ".homeybuild/$STAMPED_PAGE" ]; then
            echo "::error::Missing packaged page: .homeybuild/$STAMPED_PAGE"
            exit 1
          fi
          # The stamper rewrites every local script/style reference of the
          # page with `?v=<8-hex>`; one such reference proves the page
          # went through it, whatever the bundle is called.
          if ! grep -qE '\?v=[0-9a-f]{8}"' ".homeybuild/$STAMPED_PAGE"; then
            echo "::error::Packaged page is unstamped:" \
              ".homeybuild/$STAMPED_PAGE"
            exit 1
          fi
      - name: URL
        env:
          URL: ${{ steps.publish.outputs.url }}
        run: echo "Publish the uploaded build at $URL" >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
name: Reusable Homey publish
on:
  workflow_call:
    inputs:
      bundles:
        description: >-
          The packaged bundles the CLI's post-copy build must emit, one path
          per line, relative to .homeybuild.
        required: true
        type: string
      stamped-page:
        default: settings/index.html
        description: >-
          The packaged page whose script reference must carry the freshness
          stamp.
        required: false
        type: string
    secrets:
      HOMEY_PAT:
        description: >-
          The Homey developer token the CLI authenticates with.
        required: true
permissions: {}
