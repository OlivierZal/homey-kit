# The apps' validation, callable: the family's install action, then
# Athom's validator at publish level. Derived from the three
# byte-identical validate.yml files the apps carried (2026-09-14) — the
# same job, steps and pins, with `workflow_call` in place of the
# triggers the caller keeps. Hosted here rather than in configs because
# it is Homey process, like the floor watch beside it: a change costs
# the three apps an adoption, not the whole family. The caller's
# checkout resolves `./.github/actions/setup-node-and-install` from its
# own tree, so the composite action stays in each app. Unlike a
# release-only reusable, this one proves itself on every app pull
# request. Callers pin it like the npm package — same tag, one version
# (configs' `check-pins.sh` polices the pair).
jobs:
  validate:
    name: Validate app
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-and-install
        with:
          node-version: '22'
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          require-npm-token: 'true'
      - name: Validate app
        uses: athombv/github-action-homey-app-validate@0f3b42c15d26aab79d7c48cde4d2805524da910e # untagged: master carries the `don't npm ci` fix the @typescript/native toolchain needs; v1 predates it
        with:
          level: publish
    timeout-minutes: 15
name: Reusable Homey validate
on:
  workflow_call: {}
permissions: {}
