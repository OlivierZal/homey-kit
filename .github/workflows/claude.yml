# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  claude:
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude.yml@76559db426286aab1f8e5ae8b0f98346cd9dfd2b # v6.0.0
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions: {}
