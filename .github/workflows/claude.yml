# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  claude:
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude.yml@f691686d44753b0dfb00a155c42ea66d89d78a1e # v6.1.0
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions: {}
