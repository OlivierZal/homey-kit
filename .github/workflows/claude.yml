# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  claude:
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude.yml@9b69e8520dfd11484df292ca75c10d51beba75ca # v6.3.1
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions: {}
