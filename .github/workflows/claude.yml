# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  claude:
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude.yml@0452a89407991c62512a64381eda175b96dbd272 # v8.3.1
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions: {}
