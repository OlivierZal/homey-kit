# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  claude:
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude.yml@2ea1b323f0428e1a86ca932e689e852c69278bb1 # v6.6.0
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions: {}
