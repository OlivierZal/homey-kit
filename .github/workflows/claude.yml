# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  claude:
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude.yml@cabbcc9146dbf0e4bec2ed8b7a261aef62cfbafa # v6.4.1
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions: {}
