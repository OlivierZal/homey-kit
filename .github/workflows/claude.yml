# Calls the family workflow of the same name in OlivierZal/configs.
jobs:
  claude:
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/claude.yml@140fc08403302560b9ae86c2aa7970ffe88e7c71 # v1.1.0
name: claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions: {}
