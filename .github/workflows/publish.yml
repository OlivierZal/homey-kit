# Calls the family's reusable publish pipeline (pack, attest the
# tarball's provenance, publish it to GitHub Packages). The `npm`
# environment is set on the called job, in configs; this stub grants
# the permissions that job claims (`id-token: write` and
# `attestations: write` for the attestation, `packages: write` for the
# publish, `contents: read`) and keeps the release trigger.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@2ea1b323f0428e1a86ca932e689e852c69278bb1 # v6.6.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
