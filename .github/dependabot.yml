registries:
  npm-github:
    token: ${{ secrets.MY_GITHUB_PERSONAL_TOKEN }}
    type: npm-registry
    url: https://npm.pkg.github.com
updates:
  - commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    directory: /
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # TypeScript 7 has no stable typedoc: 0.28.x caps its peer at 6.0.x and
    # only the 1.0.0-dev prereleases widen it. Taking the major would trade a
    # blocked bump for a prerelease docs toolchain in a published package.
    # Drop this once typedoc 1.0 ships stable.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    package-ecosystem: npm
    registries: [npm-github]
    schedule:
      interval: weekly
  - commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    directory: /
    # One version covers both channels, and the pin check enforces it.
    # Left to Dependabot, the workflow refs would move in their own PR
    # while the npm pin stayed put: each PR would then fail the check
    # and neither could merge alone. The npm bump drives, and the
    # dependabot-fix run carries the refs along in the same branch.
    ignore:
      - dependency-name: OlivierZal/configs
    package-ecosystem: github-actions
    schedule:
      interval: weekly
version: 2
